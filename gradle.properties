# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.nonFinalResIds=true
android.experimental.privatizeResources=true
android.r8.gradual.support=true
android.enableR8.fullMode=true
android.experimental.cache.preDex=true
android.experimental.test.instrumentation.managed.device.parallelism=4
